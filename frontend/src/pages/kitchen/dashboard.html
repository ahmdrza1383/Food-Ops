<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صف سفارشات آشپزخانه | FoodOps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap");
      body {
        font-family: "Vazirmatn", sans-serif;
        background-color: #f8fafc;
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen text-slate-800">
    <header class="bg-white shadow-sm sticky top-0 z-30">
      <div
        class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center"
      >
        <div class="flex items-center gap-3">
          <span class="text-2xl">🍔</span>
          <h1 class="text-xl font-extrabold text-amber-600">FoodOps</h1>
          <span
            class="text-xs bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-full"
            >پنل آشپزخانه</span
          >
        </div>
        <div class="flex items-center gap-4">
          <span
            id="user-name"
            class="text-xs bg-orange-100 text-amber-600 px-3 py-1.5 rounded-xl font-bold"
            >پرسنل آشپزخانه</span
          >
          <button
            id="logout-btn"
            class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-1.5 rounded-xl text-xs font-bold transition"
          >
            <i class="fa-solid fa-arrow-right-from-bracket ml-1"></i> خروج
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
      <div class="mb-6">
        <h2 class="text-xl font-extrabold text-slate-800">
          صف سفارشات آشپزخانه
        </h2>
        <p class="text-xs text-slate-500 mt-1">
          مدیریت و به‌روزرسانی وضعیت سفارشات
        </p>
      </div>

      <div
        class="flex flex-wrap gap-2 mb-8 bg-white p-3 rounded-2xl shadow-sm border border-slate-100"
        id="filter-tabs"
      >
        <button
          data-filter="all"
          class="filter-btn px-5 py-2.5 rounded-xl text-xs font-bold transition bg-amber-500 text-white shadow-md shadow-amber-500/20"
        >
          همه سفارش‌ها
        </button>
        <button
          data-filter="registered"
          class="filter-btn px-5 py-2.5 rounded-xl text-xs font-bold transition bg-slate-100 text-slate-600 hover:bg-slate-200"
        >
          ثبت شده (در انتظار آماده‌سازی)
        </button>
        <button
          data-filter="preparing"
          class="filter-btn px-5 py-2.5 rounded-xl text-xs font-bold transition bg-slate-100 text-slate-600 hover:bg-slate-200"
        >
          در حال آماده‌سازی
        </button>
      </div>

      <div
        id="message-container"
        class="hidden text-center py-12 text-sm text-slate-500"
      ></div>

      <div id="orders-container" class="space-y-6">
      </div>
    </main>

    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
