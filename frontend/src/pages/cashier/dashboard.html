<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پنل صندوق‌دار | FoodOps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap");
      body {
        font-family: "Vazirmatn", sans-serif;
        background-color: #f8fafc;
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen text-slate-800">
    <header class="bg-white shadow-sm sticky top-0 z-30">
      <div
        class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center"
      >
        <div class="flex items-center gap-3">
          <span class="text-2xl">🍔</span>
          <h1 class="text-xl font-extrabold text-amber-600">FoodOps</h1>
          <span
            class="text-xs bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-full"
            >پنل صندوق‌دار</span
          >
        </div>
        <div class="flex items-center gap-4">
          <span
            id="user-name"
            class="text-xs bg-orange-100 text-amber-600 px-3 py-1.5 rounded-xl font-bold"
            >صندوق‌دار</span
          >
          <button
            id="logout-btn"
            class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-1.5 rounded-xl text-xs font-bold transition"
          >
            <i class="fa-solid fa-arrow-right-from-bracket ml-1"></i> خروج
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
      <div class="mb-6">
        <h2 class="text-xl font-extrabold text-slate-800">
          تحویل سفارش‌ها به مشتری
        </h2>
        <p class="text-xs text-slate-500 mt-1">
          مدیریت سفارش‌های آماده جهت تحویل نهایی به مشتری
        </p>
      </div>

      <div
        id="message-container"
        class="hidden text-center py-12 text-sm text-slate-500"
      ></div>

      <div class="mb-6 flex flex-col md:flex-row gap-4 items-end">
        <div class="flex-grow w-full md:w-auto">
          <label
            for="search-orders"
            class="block text-xs font-bold text-slate-500 mb-1.5"
            >جستجوی سفارش</label
          >
          <input
            type="text"
            id="search-orders"
            placeholder="شناسه سفارش یا شماره موبایل مشتری..."
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-purple-500 text-sm"
          />
        </div>
      </div>

      <div id="orders-container" class="space-y-6">
      </div>
    </main>

    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
