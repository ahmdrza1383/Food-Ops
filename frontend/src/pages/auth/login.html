<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به حساب کاربری | FoodOps</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body
    class="bg-slate-50 min-h-screen flex items-center justify-center p-4 text-slate-800"
  >
    <!-- کادر اصلی با حاشیه نارنجی ملایم دقیقاً مثل صفحه ثبت‌نام -->
    <div
      class="max-w-md w-full bg-white rounded-3xl shadow-xl border-2 border-amber-400/70 p-8 md:p-10 relative"
    >
      <!-- هدر: لوگوی همبرگر + متن FoodOps -->
      <div class="text-center mb-8">
        <div class="flex items-center justify-center gap-2.5 mb-3">
          <span class="text-4xl">🍔</span>
          <span class="text-3xl font-black text-amber-600 tracking-wide"
            >FoodOps</span
          >
        </div>
        <h1 class="text-2xl font-black text-slate-800 mb-2">
          ورود به حساب کاربری
        </h1>
        <p class="text-sm text-slate-400 font-medium">
          برای سفارش سریع غذا اطلاعات خود را وارد کنید
        </p>
      </div>

      <!-- باکس نمایش پیام‌ها (خطا یا موفقیت) -->
      <div
        id="message-box"
        class="hidden mb-6 p-4 rounded-3xl text-xs font-bold text-center transition"
      ></div>

      <!-- فرم ورود -->
      <form id="login-form" class="space-y-5">
        <div>
          <label
            for="phone_number"
            class="block text-sm font-bold text-slate-700 mb-2"
            >شماره موبایل</label
          >
          <input
            type="tel"
            id="phone_number"
            name="phone_number"
            placeholder="مثال: 09000000000"
            required
            class="w-full px-4 py-3.5 rounded-3xl border border-slate-200 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 transition text-left placeholder:text-right"
            dir="ltr"
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-bold text-slate-700 mb-2"
            >رمز عبور</label
          >
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            class="w-full px-4 py-3.5 rounded-3xl border border-slate-200 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 transition text-left placeholder:text-right"
            dir="ltr"
          />
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full py-4 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-3xl shadow-lg shadow-amber-600/25 transition duration-200 text-base flex items-center justify-center gap-2 mt-8">
          <span>ورود به سیستم</span>
        </button>
      </form>

      <!-- لینک رفتن به ثبت‌نام -->
      <div class="mt-6 text-center text-sm font-medium text-slate-600">
        <span>اکانت ندارید؟</span>
        <a
          href="/src/pages/auth/register.html"
          class="font-bold text-amber-600 hover:underline mr-1"
          >ثبت نام کنید</a
        >
      </div>

      <!-- دکمه بازگشت به صفحه اصلی در انتهای کارت -->
      <div class="mt-6 text-center">
        <a
          href="/"
          class="inline-block text-xs font-medium text-slate-400 hover:text-slate-600 transition"
        >
          → بازگشت به صفحه اصلی
        </a>
      </div>
    </div>

    <script type="module" src="/src/pages/auth/login.js"></script>
  </body>
</html>
