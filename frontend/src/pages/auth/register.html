<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت‌نام در سامانه | FoodOps</title>
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body
    class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800"
  >
    <!-- کانتینر اصلی فرم ثبت‌نام با حاشیه رنگی و سایه جذاب -->
    <div
      class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-amber-500/5 p-8 border-2 border-amber-500/40"
    >
      <!-- هدر و لوگو -->
      <div class="text-center mb-8">
        <a
          href="/"
          class="inline-block text-2xl font-black text-amber-600 mb-2"
        >
          FoodOps 🍔
        </a>
        <h1 class="text-xl font-bold text-slate-800">ایجاد حساب کاربری جدید</h1>
        <p class="text-sm text-slate-500 mt-1">
          برای سفارش سریع غذا اطلاعات خود را وارد کنید
        </p>
      </div>

      <!-- کانتینر نمایش پیام‌های خطا یا موفقیت -->
      <div
        id="message-box"
        class="hidden mb-4 p-3 rounded-3xl text-sm font-medium text-center"
      ></div>

      <!-- فرم ثبت‌نام -->
      <form id="register-form" class="space-y-4" novalidate>
        <!-- نام و نام خانوادگی -->
        <div>
          <label
            for="fullname"
            class="block text-sm font-medium text-slate-700 mb-1.5 pr-2"
          >
            نام و نام خانوادگی
          </label>
          <input
            type="text"
            id="fullname"
            name="fullname"
            required
            placeholder="مثال: امیر امیزی"
            class="w-full px-4 py-2.5 rounded-3xl border border-slate-200 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 transition text-sm"
          />
        </div>

        <!-- شماره موبایل -->
        <div>
          <label
            for="phone_number"
            class="block text-sm font-medium text-slate-700 mb-1.5 pr-2"
          >
            شماره موبایل
          </label>
          <input
            type="tel"
            id="phone_number"
            name="phone_number"
            required
            placeholder="مثال: 09000000000"
            class="w-full px-4 py-2.5 rounded-3xl border border-slate-200 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 transition text-sm text-left dir-ltr"
          />
        </div>

        <!-- رمز عبور -->
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-slate-700 mb-1.5 pr-2"
          >
            رمز عبور
          </label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="حداقل ۶ کاراکتر"
            class="w-full px-4 py-2.5 rounded-3xl border border-slate-200 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 transition text-sm text-left dir-ltr"
          />
        </div>

        <!-- دکمه ثبت‌نام -->
        <button
          type="submit"
          id="submit-btn"
          class="w-full mt-4 py-3 px-4 bg-amber-600 hover:bg-amber-700 text-white font-medium rounded-xl shadow-lg shadow-amber-600/30 transition duration-200 flex items-center justify-center gap-2"
        >
          <span>ثبت‌نام در سامانه</span>
        </button>
      </form>

      <!-- لینک ورود برای کاربران قدیمی (بولد و رنگی) -->
      <div class="mt-6 text-center text-sm text-slate-600">
        قبلاً حساب کاربری ساخته‌اید؟
        <a
          href="/src/pages/auth/login.html"
          class="text-amber-600 font-bold hover:text-amber-700 hover:underline mr-1 transition"
        >
          وارد شوید
        </a>
      </div>

      <!-- لینک بازگشت به صفحه اصلی -->
      <div class="mt-4 text-center">
        <a
          href="/"
          class="text-xs text-slate-400 hover:text-slate-600 transition"
        >
          → بازگشت به صفحه اصلی
        </a>
      </div>
    </div>

    <script type="module" src="./register.js"></script>
  </body>
</html>
