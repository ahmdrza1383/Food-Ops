<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تنظیمات سیستم | FoodOps Admin</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">
    
    <!-- هدر مدیریت -->
    <header class="bg-white shadow-sm sticky top-0 z-30 border-b border-slate-200">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        
        <div class="flex items-center gap-3">
          <span class="text-2xl">🍔</span>
          <h1 class="hidden sm:block text-xl font-extrabold text-amber-600">FoodOps</h1>
          <span class="hidden md:block text-xs bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-full">پنل مدیریت</span>
        </div>

        <nav class="flex items-center gap-1 bg-slate-50 p-1.5 rounded-2xl border border-slate-200 shadow-inner">
          <a href="/src/pages/admin/menu-manager.html" class="px-4 py-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
            <i class="fa-solid fa-utensils"></i>
            <span class="hidden md:inline">مدیریت منو</span>
          </a>
          <a href="/src/pages/admin/reports.html" class="px-4 py-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
            <i class="fa-solid fa-chart-pie"></i>
            <span class="hidden md:inline">گزارشات</span>
          </a>
          <a href="/src/pages/admin/discounts.html" class="px-4 py-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
            <i class="fa-solid fa-ticket"></i>
            <span class="hidden md:inline">کدهای تخفیف</span>
          </a>
          <a href="/src/pages/admin/settings.html" class="px-4 py-2 bg-white text-amber-600 rounded-xl text-sm font-bold shadow-sm border border-slate-200/60 transition-all flex items-center gap-2">
            <i class="fa-solid fa-gear"></i>
            <span class="hidden md:inline">ساعت کاری</span>
          </a>
        </nav>

        <div class="flex items-center gap-3">
          <span id="user-name" class="hidden sm:block text-xs bg-orange-100 text-amber-600 px-3 py-1.5 rounded-xl font-bold">ادمین</span>
          <button id="logout-btn" class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span class="hidden sm:inline">خروج</span>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h2 class="text-xl font-extrabold text-slate-800">تنظیمات سیستم</h2>
            <p class="text-xs text-slate-500 mt-1">مدیریت ساعت کاری و وضعیت پذیرش سفارشات</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 max-w-2xl mx-auto">
            <form id="settings-form" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">ساعت شروع کار</label>
                        <input type="time" id="opening_time" required class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-amber-500 dir-ltr text-center" />
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">ساعت پایان کار</label>
                        <input type="time" id="closing_time" required class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-amber-500 dir-ltr text-center" />
                    </div>
                </div>

                <div class="flex items-center gap-3 p-4 bg-slate-50 rounded-xl border border-slate-100">
                    <input type="checkbox" id="is_accepting_orders" class="w-5 h-5 accent-amber-500 cursor-pointer" />
                    <label for="is_accepting_orders" class="text-sm font-bold text-slate-700 cursor-pointer">رستوران در حال حاضر سفارش می‌پذیرد</label>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <button type="submit" class="w-full py-3 bg-amber-600 text-white rounded-xl text-sm font-bold hover:bg-amber-700 transition shadow-md shadow-amber-600/20 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-save"></i> ذخیره تنظیمات
                    </button>
                </div>
            </form>

            <div id="message-box" class="mt-4 hidden p-3 rounded-xl text-center text-sm font-bold"></div>
        </div>
    </main>

    <script type="module" src="./settings.js"></script>
</body>
</html>
