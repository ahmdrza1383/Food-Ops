<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدیریت کدهای تخفیف | FoodOps Admin</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- فایل‌های تقویم شمسی -->
    <link rel="stylesheet" href="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.css">
    <script src="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">
    
    <!-- هدر مدیریت -->
    <header class="bg-white shadow-sm sticky top-0 z-30 border-b border-slate-200">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        
        <div class="flex items-center gap-3">
          <span class="text-2xl">🍔</span>
          <h1 class="hidden sm:block text-xl font-extrabold text-amber-600">FoodOps</h1>
          <span class="hidden md:block text-xs bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-full">پنل مدیریت</span>
        </div>

        <nav class="flex items-center gap-1 bg-slate-50 p-1.5 rounded-2xl border border-slate-200 shadow-inner">
          <a href="/src/pages/admin/menu-manager.html" class="px-4 py-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
            <i class="fa-solid fa-utensils"></i>
            <span class="hidden md:inline">مدیریت منو</span>
          </a>
          <a href="/src/pages/admin/reports.html" class="px-4 py-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
            <i class="fa-solid fa-chart-pie"></i>
            <span class="hidden md:inline">گزارشات</span>
          </a>
          <a href="/src/pages/admin/discounts.html" class="px-4 py-2 bg-white text-amber-600 rounded-xl text-sm font-bold shadow-sm border border-slate-200/60 transition-all flex items-center gap-2">
            <i class="fa-solid fa-ticket"></i>
            <span class="hidden md:inline">کدهای تخفیف</span>
          </a>
        </nav>

        <div class="flex items-center gap-3">
          <span id="user-name" class="hidden sm:block text-xs bg-orange-100 text-amber-600 px-3 py-1.5 rounded-xl font-bold">ادمین</span>
          <button id="logout-btn" class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span class="hidden sm:inline">خروج</span>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-xl font-extrabold text-slate-800">کدهای تخفیف</h2>
                <p class="text-xs text-slate-500 mt-1">مدیریت کمپین‌ها و کدهای تخفیف سیستم</p>
            </div>
            <button id="add-discount-btn" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-sm font-bold shadow-md shadow-amber-500/20 transition flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> ایجاد کد جدید
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-center">
                    <thead class="text-xs text-slate-500 bg-slate-50 border-b border-slate-100 uppercase">
                        <tr>
                            <th class="px-6 py-4 font-bold text-center">کد تخفیف</th>
                            <th class="px-6 py-4 font-bold text-center">درصد تخفیف</th>
                            <th class="px-6 py-4 font-bold text-center">تاریخ انقضا</th>
                            <th class="px-6 py-4 font-bold text-center">وضعیت</th>
                            <th class="px-6 py-4 font-bold text-center">عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="discounts-table-body" class="divide-y divide-slate-100">
                        <!-- توسط JS پر می‌شود -->
                    </tbody>
                </table>
            </div>
            <div id="empty-state" class="hidden text-center py-12 text-slate-500 text-sm">
                هیچ کد تخفیفی یافت نشد.
            </div>
        </div>
    </main>

    <!-- مودال ایجاد کد تخفیف -->
    <div id="discount-modal" class="fixed inset-0 z-50 transition-opacity duration-300 opacity-0 pointer-events-none flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div id="modal-panel" class="bg-white rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden z-10 transform transition-all duration-300 scale-95">
            <div class="p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-5 border-b pb-3">ایجاد کد تخفیف جدید</h2>
                <form id="discount-form" class="space-y-4" novalidate>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">کد تخفیف (انگلیسی)</label>
                        <input type="text" id="discount-code" required placeholder="مثال: YALDA1403" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-amber-500 uppercase text-left dir-ltr" />
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">درصد تخفیف</label>
                        <input type="number" id="discount-percent" required placeholder="بین ۱ تا ۱۰۰" min="1" max="100" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-amber-500 text-left dir-ltr" />
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">تاریخ انقضا (شمسی)</label>
                        <input type="text" id="discount-expire" data-jdp required placeholder="انتخاب تاریخ" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-amber-500 text-center cursor-pointer" readonly />
                    </div>
                    <div class="flex items-center gap-2 mt-2">
                        <input type="checkbox" id="discount-active" checked class="w-4 h-4 accent-amber-500 cursor-pointer" />
                        <label for="discount-active" class="text-sm font-bold text-slate-600 cursor-pointer">کد تخفیف فعال باشد</label>
                    </div>
                    <div class="flex gap-3 mt-6 pt-4 border-t border-slate-100">
                        <button type="submit" class="flex-1 py-2.5 bg-amber-600 text-white rounded-xl text-sm font-bold hover:bg-amber-700 transition shadow-md shadow-amber-600/20">ذخیره کد</button>
                        <button type="button" id="close-modal-btn" class="flex-1 py-2.5 bg-slate-100 text-slate-600 rounded-xl text-sm font-bold hover:bg-slate-200 transition">انصراف</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="./discounts.js"></script>
</body>
</html>
