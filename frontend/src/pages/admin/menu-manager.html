<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدیریت منو | FoodOps Admin</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body class="bg-slate-50 min-h-screen font-sans text-slate-800">
    <!-- Header مدیریت با قابلیت جابه‌جایی بین تب‌ها -->
    <header class="bg-white shadow-sm sticky top-0 z-30 border-b border-slate-200">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        
        <!-- بخش راست: لوگو و تگ -->
        <div class="flex items-center gap-3">
          <span class="text-2xl">🍔</span>
          <h1 class="hidden sm:block text-xl font-extrabold text-amber-600">FoodOps</h1>
          <span class="hidden md:block text-xs bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-full">پنل مدیریت</span>
        </div>

        <!-- بخش وسط: تب‌های ناوبری -->
        <nav class="flex items-center gap-1 bg-slate-50 p-1.5 rounded-2xl border border-slate-200 shadow-inner">
          <a href="/src/pages/admin/menu-manager.html" class="px-4 py-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
            <i class="fa-solid fa-utensils"></i>
            <span class="hidden md:inline">مدیریت منو</span>
          </a>
          <a href="/src/pages/admin/reports.html" class="px-4 py-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
            <i class="fa-solid fa-chart-pie"></i>
            <span class="hidden md:inline">گزارشات</span>
          </a>
          <a href="/src/pages/admin/discounts.html" class="px-4 py-2 bg-white text-amber-600 rounded-xl text-sm font-bold shadow-sm border border-slate-200/60 transition-all flex items-center gap-2">
            <i class="fa-solid fa-ticket"></i>
            <span class="hidden md:inline">کدهای تخفیف</span>
          </a>
        </nav>
        
        <!-- بخش چپ: پروفایل و خروج -->
        <div class="flex items-center gap-3">
          <span id="user-name" class="hidden sm:block text-xs bg-orange-100 text-amber-600 px-3 py-1.5 rounded-xl font-bold">ادمین</span>
          <button id="logout-btn" class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span class="hidden sm:inline">خروج</span>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
      <!-- دکمه‌های اقدام -->
      <div class="flex flex-wrap gap-3 mb-8">
        <button
          id="add-category-btn"
          class="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-sm font-bold shadow-md shadow-amber-500/20 transition flex items-center gap-2"
        >
          <i class="fa-solid fa-plus"></i> دسته‌بندی جدید
        </button>
        <button
          id="add-menu-btn"
          class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-bold shadow-md shadow-emerald-600/20 transition flex items-center gap-2"
        >
          <i class="fa-solid fa-utensils"></i> غذای جدید
        </button>
      </div>

      <!-- بخش لیست دسته‌بندی‌ها -->
      <div
        class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-8"
      >
        <h3 class="font-bold text-slate-700 mb-3 text-sm">
          دسته‌بندی‌های موجود
        </h3>
        <div id="categories-container" class="flex flex-wrap gap-2">
          <!-- توسط JS پر می‌شود -->
        </div>
      </div>

      <!-- بخش لیست غذاها -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="font-bold text-slate-700 mb-3 text-sm">لیست غذاها</h3>
        <div
          id="menu-items-grid"
          class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
        >
          <!-- توسط JS پر می‌شود -->
        </div>
      </div>
    </main>

    <!-- مودال جهانی برای ساخت/ویرایش -->
    <div
      id="admin-modal"
      class="fixed inset-0 z-50 transition-opacity duration-300 opacity-0 pointer-events-none flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
    >
      <div
        id="modal-panel"
        class="bg-white rounded-3xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto z-10 transform transition-all duration-300 scale-95"
      >
        <div class="p-6">
          <h2 id="modal-title" class="text-xl font-bold text-slate-800 mb-4">
            عنوان مودال
          </h2>
          <form id="admin-form" class="space-y-4" novalidate>
            <input type="hidden" id="form-id" value="" />
            <input type="hidden" id="form-type" value="" />

            <!-- فیلدهای دسته‌بندی -->
            <div id="category-fields">
              <label class="block text-sm font-bold text-slate-700 mb-1"
                >نام دسته‌بندی</label
              >
              <input
                type="text"
                id="cat-name"
                class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:border-amber-500"
              />
              <div class="flex items-center gap-2 mt-2">
                <input type="checkbox" id="cat-active" checked />
                <label for="cat-active" class="text-sm text-slate-600"
                  >فعال</label
                >
              </div>
            </div>

            <!-- فیلدهای غذا -->
            <div id="menu-fields" class="hidden space-y-3">
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1"
                  >نام غذا</label
                >
                <input
                  type="text"
                  id="menu-name"
                  class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:border-amber-500"
                />
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1"
                  >توضیحات</label
                >
                <textarea
                  id="menu-desc"
                  class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:border-amber-500"
                  rows="2"
                ></textarea>
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1"
                  >قیمت (تومان)</label
                >
                <input
                  type="number"
                  id="menu-price"
                  class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:border-amber-500"
                  required
                />
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1"
                  >موجودی</label
                >
                <input
                  type="number"
                  id="menu-stock"
                  value="10"
                  class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:border-amber-500"
                  required
                />
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1"
                  >دسته‌بندی</label
                >
                <select
                  id="menu-category"
                  class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:border-amber-500"
                ></select>
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1"
                  >تصویر غذا</label
                >
                <input
                  type="file"
                  id="menu-image-file"
                  accept="image/*"
                  class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:border-amber-500"
                />
                <p class="text-xs text-slate-500 mt-1">یا آدرس تصویر:</p>
                <input
                  type="url"
                  id="menu-image"
                  placeholder="https://example.com/food.jpg"
                  class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:border-amber-500 mt-1"
                />
                <img
                  id="image-preview"
                  src=""
                  alt="پیش‌نمایش"
                  class="mt-2 w-full h-32 object-cover rounded-xl hidden"
                />
              </div>
              <div class="flex items-center gap-2">
                <input type="checkbox" id="menu-active" checked />
                <label for="menu-active" class="text-sm text-slate-600"
                  >فعال (نمایش در منو)</label
                >
              </div>
            </div>

            <div class="flex gap-3 mt-6 pt-4 border-t">
              <button
                type="submit"
                class="flex-1 py-2.5 bg-amber-600 text-white rounded-xl font-bold hover:bg-amber-700 transition"
              >
                ذخیره
              </button>
              <button
                type="button"
                id="close-modal-btn"
                class="flex-1 py-2.5 bg-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-300 transition"
              >
                انصراف
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="./menu-manager.js"></script>
  </body>
</html>
