<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سفارش‌های من | FoodOps</title>
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body class="bg-slate-50 min-h-screen font-sans text-slate-800 p-4 md:p-8">

    <!-- هدر صفحه -->
    <header class="max-w-4xl mx-auto flex items-center justify-between mb-8 pb-4 border-b border-slate-200">
      <div>
        <a href="/" class="text-2xl font-black text-amber-600 inline-block">
          FoodOps 🍔
        </a>
        <h1 class="text-xl font-bold text-slate-800 mt-1">تاریخچه و وضعیت سفارش‌های من</h1>
      </div>
      <a
        href="/"
        class="px-4 py-2 text-sm font-medium text-slate-600 bg-white hover:bg-slate-100 border border-slate-200 rounded-xl transition shadow-sm"
      >
        → بازگشت به منو
      </a>
    </header>

    <!-- کانتینر اصلی محتوا -->
    <main class="max-w-4xl mx-auto">
      
      <!-- باکس نمایش پیام‌های تعاملی (موفقیت یا خطا در لغو سفارش) -->
      <div id="action-message" class="hidden mb-6 p-4 rounded-xl text-sm font-medium text-center transition"></div>

      <!-- وضعیت در حال بارگذاری -->
      <div id="loading-state" class="flex flex-col items-center justify-center py-16 text-slate-500">
        <svg class="animate-spin h-8 w-8 text-amber-600 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>در حال دریافت اطلاعات سفارش‌ها...</span>
      </div>

      <!-- وضعیت لیست خالی -->
      <div id="empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
        <div class="text-4xl mb-3">🍽️</div>
        <h2 class="text-lg font-bold text-slate-700 mb-1">هنوز سفارشی ثبت نکرده‌اید!</h2>
        <p class="text-sm text-slate-500 mb-6">به صفحه اصلی برگردید و اولین سفارش خوشمزه خود را ثبت کنید.</p>
        <a
          href="/"
          class="inline-block px-6 py-2.5 bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium rounded-xl shadow-md shadow-amber-600/20 transition"
        >
          مشاهده منوی غذاها
        </a>
      </div>

      <!-- پیام خطای کلی -->
      <div id="error-box" class="hidden mb-6 p-4 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 text-sm font-medium text-center"></div>

      <!-- لیست سفارش‌ها -->
      <div id="orders-container" class="space-y-6"></div>

    </main>

    <script type="module" src="./my-orders.js"></script>
  </body>
</html>
